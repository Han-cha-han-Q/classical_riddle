<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLASSICAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
  
  <style>
    /* 全体デザイン・トーン＆マナー */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111111;
      color: #ffffff;
      font-family: 'M PLUS 1p', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* ゲーム画面枠 (最大幅 1080px) */
    .game-container {
      width: 100%;
      max-width: 1080px;
      background-color: #1a1a1a;
      border: 2px solid #facc15;
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
      position: relative;
      overflow: hidden;
      min-height: 700px;
      display: flex;
      flex-direction: column;
    }

    /* 画面切り替え共通 */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
      min-height: 700px;
      padding: 20px;
    }
    .screen.active { display: flex; }

    /* 正方形画像表示エリア（1000px × 1000px：タイトル・クリア画面用） */
    .media-area-title {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1000 / 1000;
      background-color: #0d0d0d;
      border: 1px solid #333;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .media-area-title:hover {
      border-color: #facc15;
    }

    /* 横長画像表示エリア（1080px × 550px：ルール・問題画面用） */
    .media-area-main {
      width: 100%;
      max-width: 1080px;
      aspect-ratio: 1080 / 550;
      background-color: #0d0d0d;
      border: 1px solid #333;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .media-area-main:hover {
      border-color: #facc15;
    }

    .media-area-title svg, .media-area-title img,
    .media-area-main svg, .media-area-main img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 画像拡大用モーダル */
    .image-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 300;
      justify-content: center;
      align-items: center;
      padding: 20px;
      cursor: pointer;
    }
    .image-modal.active {
      display: flex;
    }
    .modal-content {
      width: 100%;
      height: 100%;
      max-width: 95vw;
      max-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: default;
    }
    .modal-content svg, .modal-content img {
      width: 100% !important;
      height: 100% !important;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .modal-close {
      position: absolute;
      top: 15px;
      right: 25px;
      color: #ffffff;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      z-index: 301;
    }
    .modal-close:hover {
      color: #facc15;
    }

    /* ボタン・UI要素 */
    .btn-cyber {
      background: transparent;
      color: #facc15;
      border: 2px solid #facc15;
      padding: 12px 40px;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .btn-cyber:hover {
      background: #facc15;
      color: #1a1a1a;
      box-shadow: 0 0 15px #facc15;
    }

    /* ヒント用リンクのスタイル */
    .hint-link {
      color: #facc15;
      text-decoration: underline;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    .hint-link:hover {
      opacity: 0.8;
    }

    /* 解答欄・UIナビゲーション */
    .control-panel {
      width: 100%;
      max-width: 800px;
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: auto;
      padding-bottom: 20px;
    }
    .nav-btn {
      background: #262626;
      color: #facc15;
      border: 1px solid #facc15;
      padding: 12px 18px;
      font-size: 1.2rem;
      cursor: pointer;
      visibility: visible;
    }
    .nav-btn.hidden { visibility: hidden; }

    .input-form { display: flex; flex: 1; gap: 8px; }
    .answer-input {
      flex: 1;
      background: #000;
      border: 2px solid #facc15;
      color: #facc15;
      padding: 12px;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }
    /* 正解済み・非活性時のスタイル */
    .answer-input:disabled {
      background-color: #1a1a1a;
      border-color: #854d0e;
      color: #facc15;
      opacity: 0.8;
      cursor: not-allowed;
    }

    .btn-submit {
      background: #facc15;
      color: #1a1a1a;
      border: none;
      padding: 0 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:disabled {
      background: #525252;
      color: #a3a3a3;
      cursor: not-allowed;
    }

    /* ロード画面 */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0a0a;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .loading-overlay.active { display: flex; }
    .loading-text { 
      font-family: 'Orbitron', sans-serif; 
      color: #facc15; 
      font-size: 2rem; 
      margin-bottom: 25px;
      letter-spacing: 4px;
    }

    /* ロードアニメーション用コンテナ＆CSSドット */
    .bit-pattern { 
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      min-height: 40px;
    }
    .bit-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid #facc15;
      box-sizing: border-box;
      opacity: 0;
      transform: scale(0.2);
    }
    .bit-dot.fill {
      background-color: #facc15;
    }
    .bit-dot.empty {
      background-color: transparent;
    }
    .bit-dot.animate {
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.2) translateY(10px);
        box-shadow: 0 0 0px #facc15;
      }
      70% {
        opacity: 1;
        transform: scale(1.3) translateY(-3px);
        box-shadow: 0 0 20px #facc15;
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        box-shadow: 0 0 8px rgba(250, 204, 21, 0.6);
      }
    }

    /* クリア・ホワイトアウト */
    .whiteout {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #fff; opacity: 0; pointer-events: none;
      transition: opacity 2.5s; z-index: 200;
    }
    .whiteout.active { opacity: 1; }
    
    .clear-message {
      font-size: 1.25rem;
      font-weight: bold;
      color: #facc15;
      margin: 15px 0 5px 0;
      text-align: center;
    }

    .share-btn {
      display: block;
      background: #1d9bf0;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      margin: 15px 0;
      font-weight: bold;
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
    }

    .author-link {
      color: #facc15;
      text-decoration: none;
    }
    .author-link:hover {
      text-decoration: underline;
    }

    /* スマホ向け（画面幅600px以下）レスポンシブスタイル */
    @media (max-width: 600px) {
      body {
        padding: 0;
      }
      .game-container {
        border-width: 1px;
        min-height: 100vh;
        border-radius: 0;
      }
      .screen {
        padding: 15px 10px;
        min-height: 100vh;
      }
      .btn-cyber {
        padding: 10px 30px;
        font-size: 1.2rem;
      }
      .control-panel {
        gap: 6px;
        padding-bottom: 15px;
      }
      .nav-btn {
        padding: 10px 12px;
        font-size: 1rem;
      }
      .answer-input {
        padding: 10px 6px;
        font-size: 0.9rem;
      }
      .btn-submit {
        padding: 0 12px;
        font-size: 0.9rem;
      }
      .clear-message {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="game-container">
    
    <div id="screen-title" class="screen active">
      <div class="media-area-title" onclick="openModal(this)">
        <img src="title.png" alt="タイトル画像">
      </div>
      <p style="margin-top:5px; color:#aaa;">制作: <a href="https://x.com/Han_cha_han_Q" target="_blank" rel="noopener noreferrer" class="author-link">はんちゃーはん</a></p>
      <button onclick="toRule()" class="btn-cyber">NEXT</button>
    </div>

    <div id="screen-rule" class="screen">
      <div class="media-area-main" onclick="openModal(this)">
        <img src="rule.svg" alt="ルール画像">
      </div>
      <button onclick="startGame()" class="btn-cyber">GAME START</button>
      
      <div style="margin-top: 15px;">
        <a href="https://han-cha-han-q.github.io/classical_hint/" target="_blank" rel="noopener noreferrer" class="hint-link">ヒントはこちらから</a>
      </div>
    </div>

    <div id="screen-question" class="screen">
      <div class="media-area-main" id="question-media" onclick="openModal(this)">
        </div>

      <div id="msg" style="height:24px; color:#ef4444; font-size:0.9rem; margin-top:5px;"></div>

      <div class="control-panel">
        <button id="btn-prev" class="nav-btn" onclick="prevStage()">◀</button>
        <form onsubmit="handleCheck(event)" class="input-form">
          <input type="text" id="answer-input" class="answer-input" placeholder="解答を入力して下さい" autocomplete="off">
          <button type="submit" id="btn-submit" class="btn-submit">決定</button>
        </form>
        <button id="btn-next" class="nav-btn" onclick="nextStage()">▶</button>
      </div>
    </div>

    <div id="screen-clear" class="screen" style="overflow-y:auto; padding-bottom:40px;">
      <div class="media-area-title" onclick="openModal(this)">
        <img src="clear.png" alt="クリア画像">
      </div>
      <p style="color:#888; font-size:0.8rem; margin:10px 0;">クリア画像は自由にお使いください</p>
      <p class="clear-message">あなたは"古典的"な謎を全て解き明かした！</p>
      
      <a href="https://x.com/intent/post?text=Web%E8%AC%8E%E3%80%8CCLASSICAL%E3%80%8D%0A%0A%F0%9F%94%8D%F0%9F%92%A0CLEAR%21%21%F0%9F%92%A0%F0%9F%94%8D%0A%0A%23Web%E8%AC%8E%E3%80%80%23CLASSICAL_riddle%0A%0A%E3%83%97%E3%83%AC%E3%82%A4%E3%81%AF%E3%81%93%E3%81%A1%E3%82%89%E3%81%8B%E3%82%89%E2%86%93%0Ahttps%3A%2F%2Fhan-cha-han-q.github.io%2Fclassical_riddle%2F%0Apic.twitter.com%2FJgUPa9ka3M" 
         target="_blank" 
         rel="noopener noreferrer" 
         onclick="openXShare(event, this.href)"
         class="share-btn">クリアポストはこちらから</a>
      
      <div style="text-align:center; color:#ccc; border-top:1px solid #333; width:100%; padding-top:20px;">
        <p>
          制作：<a href="https://x.com/Han_cha_han_Q" target="_blank" rel="noopener noreferrer" class="author-link">はんちゃーはん</a> / 
          テストプレイ：<a href="https://x.com/4N474N0" target="_blank" rel="noopener noreferrer" class="author-link">Your/ゆーあーる</a>、<a href="https://x.com/nanayu_dayo" target="_blank" rel="noopener noreferrer" class="author-link">ななゆう〜nanayu〜</a>
        </p>
        <p style="margin: 5px 0;">Thank you for playing！</p>
      </div>
    </div>

    <div id="loading" class="loading-overlay">
      <div class="loading-text">LOADING...</div>
      <div id="bit" class="bit-pattern"></div>
    </div>

    <div id="whiteout" class="whiteout"></div>

    <div id="image-modal" class="image-modal" onclick="closeModal()">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <div class="modal-content" id="modal-content" onclick="event.stopPropagation()"></div>
    </div>

  </div>

  <script>
    const ANSWERS = { 1: "あおい", 2: "あかし", 3: "ほたる", 4: "おとめ" };
    
    // 正解保存用オブジェクト
    const savedAnswers = {};

    // ロード表示用パターン
    const PATTERNS = {
      "start": "001001", 
      "1-2": "001101", 
      "2-3": "011001", 
      "3-4": "010101", 
      "2-1": "001001",
      "3-2": "001101",
      "4-3": "011001"
    };

    /* 問題ごとのSVGファイル指定 */
    const QUESTION_IMAGES = {
      1: `<img src="q1.svg" alt="問題1">`,
      2: `<img src="q2.svg" alt="問題2">`,
      3: `<img src="q3.svg" alt="問題3">`,
      4: `<img src="q4.svg" alt="問題4">`
    };

    let currentStage = 1;
    let maxReachedStage = 1;

    /* X(Twitter)共有リンク起動用関数 */
    function openXShare(e, url) {
      // 一部のアプリ内ブラウザ等で別ウィンドウ開きを確実にする処理
      if (e) e.preventDefault();
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    /* 画像拡大モーダル制御 */
    function openModal(element) {
      const modal = document.getElementById('image-modal');
      const modalContent = document.getElementById('modal-content');
      modalContent.innerHTML = element.innerHTML;
      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('image-modal');
      modal.classList.remove('active');
    }

    function toRule() {
      document.getElementById('screen-title').classList.remove('active');
      document.getElementById('screen-rule').classList.add('active');
    }

    function startGame() {
      showLoading("start", () => {
        document.getElementById('screen-rule').classList.remove('active');
        document.getElementById('screen-question').classList.add('active');
        updateStage();
      });
    }

    function updateStage() {
      document.getElementById('question-media').innerHTML = QUESTION_IMAGES[currentStage];
      document.getElementById('msg').textContent = "";

      const inputElem = document.getElementById('answer-input');
      const submitBtn = document.getElementById('btn-submit');

      // 過去に正解済みかどうかの確認
      if (savedAnswers[currentStage]) {
        inputElem.value = savedAnswers[currentStage];
        inputElem.disabled = true;
        submitBtn.disabled = true;
      } else {
        inputElem.value = "";
        inputElem.disabled = false;
        submitBtn.disabled = false;
      }
      
      document.getElementById('btn-prev').classList.toggle('hidden', currentStage === 1);
      const isCleared = (currentStage < maxReachedStage);
      const isNotLast = (currentStage < 4);
      document.getElementById('btn-next').classList.toggle('hidden', !(isCleared && isNotLast));
    }

    function handleCheck(e) {
      e.preventDefault();
      
      // 既に正解済みの場合は処理しない
      if (savedAnswers[currentStage]) return;

      const input = document.getElementById('answer-input').value.trim();
      if (input === ANSWERS[currentStage]) {
        // 正解を保持
        savedAnswers[currentStage] = input;

        if (currentStage === 4) {
          triggerClear();
        } else {
          if (currentStage === maxReachedStage) {
            maxReachedStage++;
          }
          const pKey = `${currentStage}-${currentStage+1}`;
          showLoading(pKey, () => {
            currentStage++;
            updateStage();
          });
        }
      } else {
        document.getElementById('msg').textContent = "不正解です";
      }
    }

    function nextStage() {
      const pKey = `${currentStage}-${currentStage+1}`;
      showLoading(pKey, () => { currentStage++; updateStage(); });
    }

    function prevStage() {
      const pKey = `${currentStage}-${currentStage-1}`;
      showLoading(pKey, () => { 
        currentStage--; 
        updateStage(); 
      });
    }

    function showLoading(key, callback) {
      const bitStr = PATTERNS[key] || "000000";
      const bitContainer = document.getElementById('bit');
      const loader = document.getElementById('loading');
      
      bitContainer.innerHTML = '';
      loader.classList.add('active');

      const dots = [];
      for (let i = 0; i < bitStr.length; i++) {
        const dot = document.createElement('div');
        dot.className = `bit-dot ${bitStr[i] === '1' ? 'fill' : 'empty'}`;
        bitContainer.appendChild(dot);
        dots.push(dot);
      }

      let step = 0;
      const interval = setInterval(() => {
        if (step < dots.length) {
          dots[step].classList.add('animate');
          step++;
        } else {
          clearInterval(interval);
          setTimeout(() => {
            loader.classList.remove('active');
            callback();
          }, 400);
        }
      }, 120);
    }

    function triggerClear() {
      document.getElementById('whiteout').classList.add('active');
      setTimeout(() => {
        document.getElementById('screen-question').classList.remove('active');
        document.getElementById('screen-clear').classList.add('active');
        document.getElementById('whiteout').classList.remove('active');
      }, 2500);
    }
  </script>
</body>
</html>
